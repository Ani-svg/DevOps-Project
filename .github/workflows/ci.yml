name: Granthalaya CI Pipeline

on:
  push:
    branches:
      - docker-setup
      - main
      - production

  pull_request:
    branches:
      - main
      - production

  workflow_dispatch:

jobs:

  # ---------------- CI: BUILD AND TEST ----------------

  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker installation
        run: docker --version

      - name: Configure test environment
        run: |
          cat > .env <<'EOF'
          MYSQL_ROOT_PASSWORD=ci_root_password
          MYSQL_DATABASE=granthalaya
          MYSQL_USER=granthalaya_app
          MYSQL_PASSWORD=ci_app_password
          DB_HOST=mysql
          DB_PORT=3306
          DB_NAME=granthalaya
          DB_USER=granthalaya_app
          DB_PASSWORD=ci_app_password
          EOF

      - name: Build Docker containers
        run: docker compose up -d --build

      - name: Wait for application
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8081/api/public/stats; then
              echo "Application is ready"
              exit 0
            fi

            echo "Waiting for application..."
            sleep 5
          done

          docker compose logs
          exit 1

      - name: Run automated API tests
        run: |
          docker compose run --rm --no-deps \
            -v "${GITHUB_WORKSPACE}/backend:/tests:ro" \
            -w /tests \
            -e API_BASE_URL=http://nginx \
            backend node --test

      - name: Verify containers
        run: docker compose ps

      - name: Cleanup
        if: always()
        run: docker compose down


  # ---------------- CD: BLUE-GREEN DEPLOYMENT ----------------

  deploy:
    name: Blue-Green Deployment

    needs: build-and-test

    if: >-
      github.ref == 'refs/heads/docker-setup' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker installation
        run: docker --version

      - name: Verify runtime configuration
        run: |
          test -f /home/aniket/DevOps-Project/nginx/active-backend.conf
          echo "Runtime Nginx configuration found."

      - name: Make deployment script executable
        run: chmod +x scripts/deploy-bluegreen.sh

      - name: Deploy using Blue-Green strategy
        env:
          DB_HOST: ${{ secrets.GRANTHALAYA_DB_HOST }}
          DB_PORT: ${{ secrets.GRANTHALAYA_DB_PORT }}
          DB_NAME: ${{ secrets.GRANTHALAYA_DB_NAME }}
          DB_USER: ${{ secrets.GRANTHALAYA_DB_USER }}
          DB_PASSWORD: ${{ secrets.GRANTHALAYA_DB_PASSWORD }}
          ACTIVE_CONFIG_PATH: /home/aniket/DevOps-Project/nginx/active-backend.conf

        run: ./scripts/deploy-bluegreen.sh
