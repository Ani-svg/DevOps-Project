name: Granthalaya CI Pipeline

on:
  push:
    branches:
      - main
      - production
      - release-v4-cleanup

  pull_request:
    branches:
      - main
      - production

  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker installation
        run: docker --version

      - name: Validate CI Docker Compose
        run: docker compose -p granthalaya-ci -f docker-compose.ci.yml config

      - name: Build application and run automated tests
        run: |
          docker compose -p granthalaya-ci \
            -f docker-compose.ci.yml \
            up --build --abort-on-container-exit --exit-code-from tests

      - name: Show container status
        if: always()
        run: |
          docker compose -p granthalaya-ci \
            -f docker-compose.ci.yml ps -a

      - name: Cleanup CI containers
        if: always()
        run: |
          docker compose -p granthalaya-ci \
            -f docker-compose.ci.yml down
