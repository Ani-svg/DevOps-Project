services:

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ci_root_password
      MYSQL_DATABASE: granthalaya
    volumes:
      - ./database/init/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pci_root_password"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: granthalaya
      DB_USER: root
      DB_PASSWORD: ci_root_password
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/public/stats').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20

  tests:
    image: node:20-alpine
    working_dir: /tests
    volumes:
      - ./backend/tests:/tests:ro
    environment:
      API_BASE_URL: http://backend:3000
    depends_on:
      backend:
        condition: service_healthy
    command: ["node", "--test"]
